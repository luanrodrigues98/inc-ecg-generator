# Realism experiment, variant "all": every group at the p the v2 file proposes for the full dataset.
# One of batch_ptbxl_inc_exp_*.yaml: 1500 pages each, the same 1500 records (the runner
# takes the first 1500 by name), same seed, dpi and chain, so they differ only in realism.
# Run: .venv310/bin/python run_batch_from_config.py batch_ptbxl_inc_exp_all.yaml
extends: batch_ptbxl_inc_v2.yaml
output_directory: /home/luan-rodrigues/faculdade/inc-ecg-digitizer/datasets/ptbxl_synthetic_inc_exp/all
max_num_images: 1500
# handwriting came after this variant was defined: held off here so the variant renders
# what it did; its effect is measured by batch_ptbxl_inc_exp_handwriting.yaml.
realism:
  handwriting: {p: 0.0}
