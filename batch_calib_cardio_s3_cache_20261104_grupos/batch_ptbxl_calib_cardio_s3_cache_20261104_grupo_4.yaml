# ~/.cache/inc-ecg-generator-run/calib/cardio_s3_cache_grupos_inc_grid-20261105/ (relatorio.md).
# FWHM of the horizontal rules, px, on the digitizer's 400 dpi page (prepare_page, rectifier_v2):
#   real: ONE exam - per lead (24 leads, both scans) 5 mm 5 / 6 / 7 (p10/p50/p90), 1 mm 3 / 3 / 4;
#     per page (profile_pages.py, the 600 dpi scan) 5 mm 6, 1 mm 3; contrast 11.8 / 11.0.
#   this file without inc_grid (2026-11-04 probe, 3 pages at 400 dpi): 5 mm 3 / 3 / 3, 1 mm 3 / 3 / 3,
#     contrast 16.0 / 13.9.
#   chosen, WIDENED rather than fitted (one exam): p 1.0, major_mm [0.20, 0.45] -> 3.3-7.1 px (this
#     exam's 5-7 px and group 2's 3-5.5 px, the same CLB sheet); minor_ratio [0.35, 0.70] -> 1 mm
#     rule 0.07-0.32 mm, 2-5 px (this exam's 1 mm rule is half the 5 mm one's width).
#   NOT PROBED: the run's 24-page budget went to the larger and the low-resolution groups. Same
#     palette 9, scan chain and dpi range as group 2, whose probe confirmed the transfer curve.
#     Darkness as group 2's: ~16 against this exam's 11.8 (1.36x per page, 1.5x per lead) - feature
#     request grid-rule-contrast.md in the run. Unlike group 2 the top is not cut for darkness: per
#     page this exam is 1.36x, under the run's 50% rule, and its 5 mm rule sits at 5-7 px in bulk.
#   Confidence: low (n = 1 exam, not probed).
extends: ../batch_ptbxl_calib_cardio_s3_cache_20261004.yaml

output_directory: /home/luan-rodrigues/faculdade/inc-ecg-digitizer/datasets/ptbxl_synthetic_calib_cardio_s3_cache_20261104_grupo_4

# The user's decision (2026-11-04): 2000 pages for each group, one YAML each.
max_num_images: 2000

randomize:
  # 3x4 + rhythm (the CLB's only format).
  num_columns:
    choice: [4]
  # Resolution: the kept scan is 600 dpi (its repeat 300 dpi); the recipe's 350-600 is kept.

# Name above the trace (the CLB's).
lead_name_position: 'above:1.0'

# No pulse at the left: the CLB never prints one.
calibration_pulse: 0.0

realism:
  # Palette 9: grid 236/190/167 on this page, as group 2's pale sheets (248/203/182).
  inc_paper:
    p: 1.0
    palettes: [9]
  # Blue pen trace, medium (FWHM 0.31 mm on this page) -> 0.15-0.32 mm as group 2.
  inc_trace:
    p: 1.0
    colors: ['#1a3a8f', '#2451b0', '#132968']
    thickness_mm: [0.15, 0.32]
  # Flatbed scan. exposure [0.85, 0.97] (v2's range, which put white paper at 232-241) instead
  # of the recipe's [0.90, 1.02]: this page's paper is 237/232/229, darker than group 2's.
  scan_look:
    p: 1.0
    rotate: 1
    blur_sigma: 0.6
    exposure: [0.85, 0.97]
    contrast: [0.97, 1.05]
    white_point: [0.99, 1.0]
    saturation: [0.9, 1.2]
    noise: 2
  # The page carries faint pencil writing on its band; group 2's CLB share of pen notes (6/20)
  # is used, since one page cannot give a share.
  handwriting:
    p: 0.3
    n_notes: [1, 4]
    writers: [1, 2]
    kinds: {date: 0.25, time: 0.15, name: 0.25, signature: 0.15, note: 0.2}
    regions: {header: 0.4, margin: 0.2, between_rows: 0.25, over_trace: 0.15}
    ink: ['#1b2a7c', '#22349a', '#2a3a8c', '#1e2f6e', '#1c1c22', '#2a2a30']
    opacity: [0.75, 0.95]
    height_mm: [5.0, 15.0]
    stroke_mm: [0.25, 0.5]
    tilt_deg: 6.0
    bias: [0.6, 1.5]
    styles: [0, 1, 2, 3, 4, 5, 6, 7]
    avoid_names: true
  # Grid rule widths: see GRID RULE WIDTH in the header.
  inc_grid:
    p: 1.0
    major_mm: [0.20, 0.45]
    minor_ratio: [0.35, 0.70]
